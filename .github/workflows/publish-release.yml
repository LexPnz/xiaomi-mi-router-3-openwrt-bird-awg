name: Publish Xiaomi Mi Router 3 firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        default: 'v1.0.4'
        type: string

permissions:
  contents: read

concurrency:
  group: mir3-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-mi-router-3-openwrt
          path: release-files

      - name: Verify firmware and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IMAGES < <(
            find release-files -maxdepth 1 -type f -name '*.bin'
          )
          if [ "${#IMAGES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one firmware image; found ${#IMAGES[@]}."
            exit 1
          fi
          test -s release-files/sha256sums.txt
          (
            cd release-files
            sha256sum -c sha256sums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Xiaomi Mi Router 3 OpenWrt ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/*.bin
            release-files/sha256sums.txt
          fail_on_unmatched_files: true
