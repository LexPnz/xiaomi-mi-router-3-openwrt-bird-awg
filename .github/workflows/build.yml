name: Build Xiaomi Mi Router 3 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'patches/**'
      - 'overlay/**'
      - 'OPENWRT_COMMIT'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: mir3-firmware-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout firmware project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath \
            python3 python3-dev python3-pyelftools \
            python3-venv qemu-utils squashfs-tools

      - name: Checkout pinned OpenWrt source
        run: |
          set -eux
          OPENWRT_COMMIT="$(cat OPENWRT_COMMIT)"
          git init openwrt
          git -C openwrt remote add origin \
            https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"

      - name: Apply project patch and overlay
        run: |
          set -eux
          git -C openwrt apply --check \
            "$GITHUB_WORKSPACE/patches/0001-mir3-customizations.patch"
          git -C openwrt apply \
            "$GITHUB_WORKSPACE/patches/0001-mir3-customizations.patch"
          cp -a "$GITHUB_WORKSPACE/overlay/." openwrt/

      - name: Cache downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ${{ runner.os }}-mir3-${{ hashFiles('OPENWRT_COMMIT', 'config/.config', 'patches/**', 'overlay/**') }}
          restore-keys: |
            ${{ runner.os }}-mir3-

      - name: Configure feeds and build
        working-directory: openwrt
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp "$GITHUB_WORKSPACE/config/.config" .config

          echo "=== Проверка BIRD3 после копирования конфигурации ==="
          grep -E '^CONFIG_PACKAGE_(bird3|bird3c)=y$' .config
          grep -qx 'CONFIG_PACKAGE_bird3=y' .config || {
            echo "::error::bird3 missing immediately after copying config"
            exit 1
          }

          echo "=== Диагностика пакета BIRD3 до defconfig ==="
          echo "--- feed list ---"
          ./scripts/feeds list -i | grep -E '^(bird3|bird3c) ' || true
          echo "--- Makefile candidates ---"
          find package/feeds package -path '*/bird3/Makefile' -o -path '*/bird3c/Makefile' 2>/dev/null || true
          echo "--- feed symlinks ---"
          ls -ld package/feeds/routing package/feeds/routing/bird3 2>/dev/null || true
          echo "--- config before defconfig ---"
          grep -E '^CONFIG_PACKAGE_(bird3|bird3c)=' .config || true

          make defconfig

          echo "=== Проверка обязательных пакетов после defconfig ==="
          for option in \
            CONFIG_PACKAGE_bind-dig \
            CONFIG_PACKAGE_bind-host \
            CONFIG_PACKAGE_mtr-nojson \
            CONFIG_PACKAGE_tracertools \
            CONFIG_PACKAGE_mc \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-app-firewall \
            CONFIG_PACKAGE_luci-theme-bootstrap \
            CONFIG_PACKAGE_rpcd-mod-rrdns \
            CONFIG_PACKAGE_kmod-ipt-offload; do
            if ! grep -qx "${option}=y" .config; then
              echo "::error::Required local-build option missing after defconfig: ${option}=y"
              exit 1
            fi
          done
          grep -E '^(CONFIG_PACKAGE_(bird3|wireguard-tools|luci-proto-wireguard)=y)$' .config || true

          for option in \
            CONFIG_PACKAGE_bird3 \
            CONFIG_PACKAGE_bird3c \
            CONFIG_PACKAGE_htop \
            CONFIG_PACKAGE_iperf3 \
            CONFIG_PACKAGE_wireguard-tools \
            CONFIG_PACKAGE_luci-proto-wireguard; do
            if ! grep -qx "${option}=y" .config; then
              echo "::error::Required option missing after defconfig: ${option}=y"
              exit 1
            fi
          done

          if grep -qx 'CONFIG_IPV6=y' .config; then
            echo "::error::IPv6 is enabled, but this build must be IPv4-only"
            exit 1
          fi

          echo "=== Конфигурация проверена ==="
          make download -j"$(nproc)"
          make -j"$(nproc)" V=s

      - name: Verify required packages in firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          TARGET="bin/targets/ramips/mt7620"

          echo "=== Проверка манифеста сборки ==="
          MANIFEST="$(find "$TARGET" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::Target package manifest not found"
            exit 1
          fi

          for pkg in bird3 bird3c htop iperf3 luci-proto-wireguard wireguard-tools; do
            if ! grep -Eq "^${pkg} -" "$MANIFEST"; then
              echo "::error::Required package missing from manifest: $pkg"
              exit 1
            fi
            echo "OK manifest: $pkg"
          done

          echo "=== Поиск sysupgrade-образа ==="
          mapfile -t IMAGES < <(
            find "$TARGET" -maxdepth 1 -type f \
              -name '*xiaomi*miwifi-r3*squashfs-sysupgrade.bin'
          )
          if [ "${#IMAGES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sysupgrade image, found ${#IMAGES[@]}"
            exit 1
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          tar -xf "${IMAGES[0]}" -C "$TMP"
          ROOT="$(find "$TMP" -type f -name root -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "::error::SquashFS root image not found inside sysupgrade archive"
            exit 1
          fi

          CONTENTS="$TMP/squashfs-files.txt"
          unsquashfs -ll "$ROOT" > "$CONTENTS"

          echo "=== Проверка файлов внутри rootfs ==="
          for path in \
            usr/sbin/bird \
            usr/sbin/birdc \
            usr/bin/htop \
            usr/bin/iperf3 \
            lib/apk/packages/bird3.list \
            lib/apk/packages/bird3c.list \
            lib/apk/packages/htop.list \
            lib/apk/packages/iperf3.list \
            lib/apk/packages/luci-proto-wireguard.list \
            lib/apk/packages/wireguard-tools.list; do
            if ! grep -Fq "squashfs-root/$path" "$CONTENTS"; then
              echo "::error::Required file missing from firmware rootfs: /$path"
              exit 1
            fi
            echo "OK rootfs: /$path"
          done

          echo "=== Все обязательные пакеты проверены ==="

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/release-files/diagnostics"
          mkdir -p "$OUT"

          if [ -f openwrt/.config ]; then
            cp openwrt/.config "$OUT/final.config"
            sed -i '/WECHAT/Id' "$OUT/final.config"
            grep -E '^(CONFIG_PACKAGE_(bird3|bird3c|htop|iperf3|wireguard-tools|luci-proto-wireguard)=y|CONFIG_IPV6=y)' \
              openwrt/.config > "$OUT/key-options.txt" || true
          fi

          MANIFEST="$(find openwrt/bin/targets/ramips/mt7620 -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "$OUT/manifest"
          fi

          if [ -d openwrt/bin/targets/ramips/mt7620 ]; then
            find openwrt/bin/targets/ramips/mt7620 -maxdepth 1 -type f \
              -printf '%f %s bytes\\n' > "$OUT/target-files.txt"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-mi-router-3-build-diagnostics
          path: release-files/diagnostics/*
          if-no-files-found: warn
          retention-days: 30

      - name: Collect firmware and checksum
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/release-files"
          mkdir -p "$OUT"

          mapfile -t IMAGES < <(
            find openwrt/bin/targets/ramips/mt7620 \
              -maxdepth 1 -type f \
              -name '*xiaomi*miwifi-r3*squashfs-sysupgrade.bin'
          )

          if [ "${#IMAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one Xiaomi Mi Router 3 sysupgrade image."
            find openwrt/bin/targets/ramips/mt7620 \
              -maxdepth 1 -type f -name '*sysupgrade.bin' || true
            exit 1
          fi

          cp "${IMAGES[0]}" "$OUT/"
          cd "$OUT"
          sha256sum ./*.bin > sha256sums.txt
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-mi-router-3-openwrt
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
