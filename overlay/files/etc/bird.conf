log stderr all;

# Указать свой ID для BGP.
# Set your own BGP router ID.
router id 172.16.1.1;

protocol device {
        scan time 300;
}

protocol kernel kernel_routes {
        scan time 60;

        ipv4 {
                import none;
                export all;
        };
}

protocol static my_vpn {
        ipv4 {
                export all;
        };

        # Пример статического маршрута через wg0.
        # Example of a static route via wg0.
        # route 1.1.1.1/24 via "wg0";
}

