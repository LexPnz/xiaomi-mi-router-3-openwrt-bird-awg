log stderr all;

# Указать свой ID для BGP
router id 172.16.1.1;

protocol device {
        scan time 300;
}

protocol kernel kernel_routes {
        scan time 60;

        ipv4 {
                import none;
                export all;
        };
}

protocol static my_vpn {
        ipv4 {
                export all;
        };

        # Пример статического маршрута, если надо завернуть на wg0
        # route 1.1.1.1/24 via "wg0";
}

protocol bgp antifilter {
        ipv4 {
                import filter {
                        # Куда отправлять трафик полученный по BGP, wg0 - интерфейс wireguard
                        ifname = "wg0";
                        accept;
                };
                export none;
        };

        # Указать AS для BGP
        # local as 65001;

        # Указать IP BGP сервера и AS=65001 (например)
        # neighbor 192.168.44.1 as 65001;

        multihop;
        hold time 240;
}
