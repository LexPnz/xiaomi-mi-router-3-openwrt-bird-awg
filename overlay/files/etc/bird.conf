log stderr all;

# Указать свой ID для BGP.
# Set your own BGP router ID.
router id 172.16.1.1;

protocol device {
        scan time 300;
}

protocol kernel kernel_routes {
        scan time 60;

        ipv4 {
                import none;
                export all;
        };
}

protocol static my_vpn {
        ipv4 {
                export all;
        };

        # Статический маршрут через awg0.
        # Static route via awg0.

        route 45.154.73.71/32 via "awg0";
}

#
# Настройка BGP для ANTIFILTER.NETWORK (https://antifilter.download/).
# При необходимости укажите свои параметры.
# Example BGP configuration for ANTIFILTER.NETWORK (https://antifilter.download/).
# Specify your own parameters if needed.
#
protocol bgp antifilter {
        ipv4 {
                 import filter {
                        # Интерфейс для полученных BGP-маршрутов.
                        # Interface for received BGP routes.
                        ifname = "awg0";
                        accept;
                };
                export none;
        };

        # Номер автономной системы (AS) маршрутизатора из примера ANTIFILTER.NETWORK.
        # Router autonomous system number (AS) from the ANTIFILTER.NETWORK example.
        local as 65051;

        # Адрес BGP-сервера ANTIFILTER.NETWORK и номер его автономной системы (AS).
        # ANTIFILTER.NETWORK BGP server address and its autonomous system number (AS).
        neighbor 45.154.73.71 as 65432;

        multihop;
        hold time 240;
}
